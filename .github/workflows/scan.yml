name: Scan

on:
  schedule:
    - cron: "*/15 * * * *"  # резервный запуск каждые 15 минут; GitHub может запускать расписание с задержкой
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Только отправить тестовое сообщение в Telegram"
        type: boolean
        default: false
      dry_run:
        description: "Пробный запуск: сообщения не отправлять, только показать текст в логе"
        type: boolean
        default: false

# Цепочка запусков идёт с интервалом 15 минут (каждый запуск сам ставит следующий).
env:
  RUN_EVERY_MIN: "15"

# actions: write нужен, чтобы запуск мог запустить следующий (цепочка запусков)
permissions:
  contents: read
  actions: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Восстановить память бота (какие звёзды уже видели)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Запуск сканера
        run: python scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

      - name: Сохранить память бота
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: Следующий запуск (цепочка)
        # Следующий запуск ставится сразу, пока этот ещё работает: он встаёт в очередь (concurrency)
        # и начинается, когда этот закончится. Потом ждём ближайшего момента :02/:17/:32/:47 и завершаемся.
        # Если GitHub остановит раннер во время ожидания, следующий запуск всё равно стартует: цепочка не рвётся.
        # Цепочку продолжают и запуски по расписанию: после любого обрыва она восстанавливается сама.
        # Тестовые и пробные запуски, а также отменённые вручную, цепочку не продолжают.
        if: ${{ !cancelled() && !inputs.test_telegram && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # GitHub иногда отвечает ошибкой 5xx (так цепочка уже обрывалась), поэтому пробуем несколько раз
          queued=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if gh workflow run scan.yml --ref "${{ github.ref_name }}"; then
              echo "Следующий запуск поставлен в очередь (попытка $attempt)"
              queued=1
              break
            fi
            echo "Попытка $attempt не удалась, повтор через 30 с"
            sleep 30
          done
          if [ "$queued" != "1" ]; then
            echo "Не удалось поставить следующий запуск (проверьте Settings -> Actions -> General -> Workflow permissions). Цепочка оборвана: её восстановит запуск по расписанию или запустите Scan вручную"
            exit 1
          fi
          now=$(date +%s)
          period=$(( RUN_EVERY_MIN * 60 ))
          next=$(( ( (now - 120 + period - 1) / period ) * period + 120 ))
          wait=$(( next - now ))
          echo "Жду ${wait} с: следующий запуск начнётся в $(date -d @${next} +%H:%M) UTC"
          sleep "$wait"
