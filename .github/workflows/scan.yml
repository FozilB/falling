name: Scan

on:
  schedule:
    - cron: "3,33 * * * *"  # запасной вариант: GitHub запускает по расписанию редко и с опозданием, основной ход - цепочка ниже
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Только отправить тестовое сообщение в Telegram"
        type: boolean
        default: false
      dry_run:
        description: "Пробный запуск: сообщения не отправлять, только показать текст в логе"
        type: boolean
        default: false

# Как часто идут запуски, в минутах: 30 = в :02 и :32 каждого часа (свечи 30м закрываются в :00 и :30; для 15 минут поставьте "15")
env:
  RUN_EVERY_MIN: "30"

# actions: write нужен, чтобы запуск мог сам запустить следующий (цепочка запусков)
permissions:
  contents: read
  actions: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Восстановить память бота (какие звёзды уже видели)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Запуск сканера
        run: python scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

      - name: Сохранить память бота
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: Следующий запуск (цепочка)
        # Ждём ближайшего момента через 2 минуты после закрытия свечи (при 30 минутах это :02 и :32,
        # при 15 минутах :02, :17, :32, :47) и запускаем следующий запуск сами. Тестовые и пробные запуски, а также отменённые вручную,
        # цепочку не продолжают.
        if: ${{ !cancelled() && !inputs.test_telegram && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          now=$(date +%s)
          period=$(( RUN_EVERY_MIN * 60 ))
          next=$(( ( (now - 120 + period - 1) / period ) * period + 120 ))
          wait=$(( next - now ))
          echo "Жду ${wait} с до следующего запуска ($(date -d @${next} +%H:%M) UTC)"
          sleep "$wait"
          gh workflow run scan.yml --ref "${{ github.ref_name }}" \
            && echo "Следующий запуск поставлен" \
            || echo "Не удалось поставить следующий запуск (проверьте Settings -> Actions -> General -> Workflow permissions); сработает расписание"
