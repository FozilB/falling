name: Scan

on:
  schedule:
    - cron: "*/15 * * * *"  # резервный запуск каждые 15 минут; GitHub может запускать расписание с задержкой
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Только отправить тестовое сообщение в Telegram"
        type: boolean
        default: false
      dry_run:
        description: "Пробный запуск: сообщения не отправлять, только показать текст в логе"
        type: boolean
        default: false

# Цепочка ручных запусков продолжает работу с интервалом 15 минут.
env:
  RUN_EVERY_MIN: "15"

# actions: write нужен, чтобы запуск мог запустить следующий (цепочка запусков)
permissions:
  contents: read
  actions: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Восстановить память бота (какие звёзды уже видели)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Запуск сканера
        run: python scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

      - name: Сохранить память бота
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: Следующий запуск (цепочка)
        # Цепочку продолжает только ручной запуск или следующий workflow_dispatch.
        # Тестовые и пробные запуски, а также отменённые вручную, цепочку не продолжают.
        if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() && !inputs.test_telegram && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          now=$(date +%s)
          period=$(( RUN_EVERY_MIN * 60 ))
          next=$(( ( (now - 120 + period - 1) / period ) * period + 120 ))
          wait=$(( next - now ))
          echo "Жду ${wait} с до следующего запуска ($(date -d @${next} +%H:%M) UTC)"
          sleep "$wait"
          # GitHub иногда отвечает ошибкой 5xx (так цепочка уже обрывалась), поэтому пробуем несколько раз
          for attempt in 1 2 3 4 5 6 7 8; do
            if gh workflow run scan.yml --ref "${{ github.ref_name }}"; then
              echo "Следующий запуск поставлен (попытка $attempt)"
              exit 0
            fi
            echo "Попытка $attempt не удалась, повтор через 30 с"
            sleep 30
          done
          echo "Не удалось поставить следующий запуск (проверьте Settings -> Actions -> General -> Workflow permissions). Цепочка оборвана: запустите Scan вручную"
          exit 1
